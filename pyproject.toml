[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-notes-skill"
version = "0.1.0"
description = "Agent skill for source-grounded audio notes and transcripts"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
online = ["openai>=1.30,<3"]
local = ["faster-whisper>=1.1,<2"]
dev = ["jsonschema>=4.22,<5"]

[tool.setuptools]
packages = []
